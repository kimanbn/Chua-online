<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thiền Tự Yên Bình - Chùa Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0d0806;
      color: #f7ede2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    header {
      width: 100%;
      max-width: 500px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(26, 16, 12, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(233, 196, 106, 0.2);
      z-index: 10;
    }
    .temple-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #e9c46a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats {
      font-size: 0.9rem;
      background: rgba(233, 196, 106, 0.15);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(233, 196, 106, 0.3);
      color: #f4a261;
      font-weight: 600;
    }
    .sanctuary {
      position: relative;
      width: 100%;
      max-width: 500px;
      flex: 1;
      background: radial-gradient(circle at 50% 35%, #2c160b 0%, #150a05 60%, #080302 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .halo {
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(233, 196, 106, 0.4) 0%, rgba(244, 162, 97, 0.1) 45%, transparent 70%);
      border-radius: 50%;
      animation: pulseHalo 4.5s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes pulseHalo {
      0% { transform: scale(0.92); opacity: 0.5; }
      100% { transform: scale(1.18); opacity: 1; }
    }
    .chant-control {
      background: rgba(38, 22, 16, 0.85);
      border: 1px solid rgba(233, 196, 106, 0.3);
      border-radius: 24px;
      padding: 8px 18px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
    }
    .status-dot.active {
      background: #2a9d8f;
      box-shadow: 0 0 10px #2a9d8f;
      animation: blink 1.4s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .lotus-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .lotus-wrap:active {
      transform: scale(0.96);
    }
    .lotus-svg {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 0 18px rgba(233, 196, 106, 0.7));
    }
    .monk-wrap {
      margin-top: -24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .monk-icon {
      font-size: 72px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .seat {
      background: linear-gradient(180deg, #9d4218 0%, #4a1c07 100%);
      border: 1.5px solid #e9c46a;
      border-radius: 30px;
      padding: 4px 20px;
      font-size: 0.85rem;
      color: #ffe8d6;
      margin-top: -6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }
    .floating-blessing {
      position: absolute;
      color: #ffe66d;
      font-weight: 700;
      font-size: 1.15rem;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 18px rgba(233,196,106,0.9);
      animation: floatMotion 1.5s ease-out forwards;
      z-index: 20;
    }
    @keyframes floatMotion {
      0% { transform: translate(-50%, 0) scale(0.85); opacity: 0; }
      15% { transform: translate(-50%, -20px) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -110px) scale(1); opacity: 0; }
    }
    .controls {
      width: 100%;
      max-width: 500px;
      padding: 14px 16px 22px;
      background: rgba(20, 12, 9, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(233, 196, 106, 0.2);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      z-index: 10;
    }
    .btn-item {
      background: linear-gradient(145deg, #28160f, #180d08);
      border: 1px solid rgba(233, 196, 106, 0.22);
      border-radius: 14px;
      padding: 10px 4px;
      color: #f7ede2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-item:active {
      transform: scale(0.92);
      border-color: #e9c46a;
      background: #381f15;
    }
    .btn-item span.icon {
      font-size: 26px;
    }
    .btn-item span.label {
      font-size: 0.78rem;
      font-weight: 500;
      color: #ddbea9;
    }
  </style>
</head>
<body>

  <!-- File âm thanh không gian thiền / tiếng chuông ngân thực tế -->

  <header>
    <div class="temple-title">🛕 Thiền Tự Yên Bình</div>
    <div class="stats" id="meritText">Công đức: 0</div>
  </header>

  <div class="sanctuary" id="sanctuary">
