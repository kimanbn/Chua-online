<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chùa Online - Thiền Tự Yên Bình</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #110905 radial-gradient(circle at 50% 30%, #3a1a0c 0%, #0d0603 80%);
      color: #ffd166;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Times New Roman", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 20px;
      overflow: hidden;
    }

    /* Thanh thông tin đỉnh */
    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(30, 15, 8, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .temple-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .merit-counter {
      background: #2b1408;
      border: 1px solid #d4af37;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
    }

    /* Khu vực tượng Phật */
    .altar-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .halo {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 183, 3, 0.1) 60%, transparent 80%);
      border-radius: 50%;
      animation: pulseGlow 3s ease-in-out infinite alternate;
      z-index: 1;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    .buddha-img {
      position: relative;
      z-index: 2;
      max-width: 240px;
      max-height: 50vh;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
    }

    /* Lư hương & Khói trầm */
    .incense-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      z-index: 2;
    }
    .incense-stick {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 8px #ffb703);
    }

    /* Hiệu ứng Công Đức bay lên */
    .merit-toast {
      position: absolute;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffe66d;
      text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px #ffb703;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 99;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.25); }
    }

    /* Bàn mõ & Nút bấm */
    .action-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-around;
      gap: 14
