<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thiền Tự Yên Bình - Chùa Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #2c1a0e 0%, #120904 100%);
      color: #ffd166;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 20px;
      overflow: hidden;
    }
    /* Thanh trạng thái đỉnh */
    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 209, 102, 0.25);
      border-radius: 20px;
    }
    .temple-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f6bd60;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .merit-counter {
      background: #3d2314;
      border: 1px solid #d4af37;
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
    }

    /* Bàn thờ & Tượng Phật */
    .altar-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      flex: 1;
    }
    /* Vòng hào quang phát sáng */
    .halo {
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 183, 3, 0.1) 60%, transparent 80%);
      border-radius: 50%;
      animation: pulseHalo 3s ease-in-out infinite alternate;
      z-index: 1;
    }
    @keyframes pulseHalo {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    /* Tượng Phật SVG */
    .buddha-svg {
      width: 180px;
      height: 220px;
      z-index: 2;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.6));
    }
    /* Khói hương bay */
    .incense-row {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      z-index: 2;
    }
    .candle {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 8px #ffb703);
    }

    /* Hiệu ứng Công Đức bay lên */
    .merit-toast {
      position: absolute;
      font-size: 1.4rem;
